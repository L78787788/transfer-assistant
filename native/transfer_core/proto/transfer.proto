syntax = "proto3";

package transassist.v1;

message Envelope {
  uint32 protocol_major = 1;
  uint32 protocol_minor = 2;
  oneof payload {
    ConnectionOpen connection_open = 9;
    Hello hello = 10;
    PairingConfirmation pairing_confirmation = 11;
    TransferOffer transfer_offer = 12;
    ManifestPage manifest_page = 13;
    OfferDecision offer_decision = 14;
    ResumeState resume_state = 15;
    TransferControl transfer_control = 16;
    TransferResult transfer_result = 17;
    ProtocolError protocol_error = 18;
  }
}

message ConnectionOpen {
  ConnectionKind kind = 1;
  string transfer_id = 2;
  bytes transfer_token = 3;
  uint32 channel_index = 4;
}

enum ConnectionKind {
  CONNECTION_KIND_UNSPECIFIED = 0;
  CONNECTION_KIND_CONTROL = 1;
  CONNECTION_KIND_DATA = 2;
}

message Hello {
  string device_id = 1;
  string display_name = 2;
  bytes certificate_fingerprint = 3;
  uint64 capabilities = 4;
}

message PairingConfirmation {
  bool confirmed = 1;
  bool remember_peer = 2;
}

message TransferOffer {
  string transfer_id = 1;
  uint32 item_count = 2;
  uint32 directory_count = 3;
  uint64 total_bytes = 4;
  repeated string top_level_names = 5;
}

message ManifestPage {
  string transfer_id = 1;
  uint32 page_index = 2;
  bool is_last = 3;
  repeated ManifestEntry entries = 4;
}

message ManifestEntry {
  string item_id = 1;
  string relative_path = 2;
  EntryKind kind = 3;
  uint64 size = 4;
  int64 modified_unix_ms = 5;
  string source_revision = 6;
  bool random_access = 7;
}

enum EntryKind {
  ENTRY_KIND_UNSPECIFIED = 0;
  ENTRY_KIND_FILE = 1;
  ENTRY_KIND_DIRECTORY = 2;
}

message OfferDecision {
  string transfer_id = 1;
  bool accepted = 2;
  string reason = 3;
  bytes transfer_token = 4;
  uint32 data_channel_count = 5;
}

message ResumeState {
  string transfer_id = 1;
  repeated FileResume files = 2;
}

message FileResume {
  string item_id = 1;
  bytes completed_bitmap = 2;
}

message TransferControl {
  string transfer_id = 1;
  ControlAction action = 2;
}

enum ControlAction {
  CONTROL_ACTION_UNSPECIFIED = 0;
  CONTROL_ACTION_PAUSE = 1;
  CONTROL_ACTION_RESUME = 2;
  CONTROL_ACTION_CANCEL = 3;
}

message TransferResult {
  string transfer_id = 1;
  bool completed = 2;
  string error = 3;
}

message ProtocolError {
  uint32 code = 1;
  string message = 2;
}

message DataChannelHello {
  string transfer_id = 1;
  uint32 channel_index = 2;
  bytes transfer_token = 3;
}

message ChunkHeader {
  string transfer_id = 1;
  string item_id = 2;
  uint32 chunk_index = 3;
  uint64 offset = 4;
  uint32 length = 5;
  bytes blake3_hash = 6;
}
